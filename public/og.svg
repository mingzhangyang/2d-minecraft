<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">2D Block Builder</title>
  <desc id="desc">Open Graph preview image for 2D Block Builder, a browser sandbox game about mining, building, and exploring.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#80c7ee"/>
      <stop offset="0.58" stop-color="#2f83aa"/>
      <stop offset="1" stop-color="#173843"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3a6"/>
      <stop offset="1" stop-color="#f7b64a"/>
    </linearGradient>
    <filter id="blockShadow" x="-12%" y="-16%" width="124%" height="132%">
      <feDropShadow dx="0" dy="18" stdDeviation="0" flood-color="#071116" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#10212a"/>
  <rect x="36" y="34" width="1128" height="562" rx="0" fill="url(#sky)"/>
  <rect x="944" y="82" width="104" height="104" fill="url(#sun)" shape-rendering="crispEdges"/>
  <g opacity="0.32" shape-rendering="crispEdges">
